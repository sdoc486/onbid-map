<body data-tab="map">

<div id="pw-overlay" style="display:none;">
  <div id="pw-box">
    <div id="pw-title">온비드 부동산 공매</div>
    <div id="pw-sub">접근하려면 비밀번호를 입력하세요</div>
    <input id="pw-input" type="password" placeholder="비밀번호"
      onkeydown="if(event.key==='Enter')checkPw()">
    <div id="pw-err"></div>
    <button id="pw-btn" onclick="checkPw()">입장</button>
  </div>
</div>
<script>
(function() {
  var PW = '260331';
  if (!PW) return;
  if (sessionStorage.getItem('onbid_auth') === PW) return;
  var overlay = document.getElementById('pw-overlay');
  overlay.style.display = 'flex';
  document.body.style.overflow = 'hidden';
  window.checkPw = function() {
    var v = document.getElementById('pw-input').value;
    if (v === PW) {
      sessionStorage.setItem('onbid_auth', PW);
      overlay.style.display = 'none';
      document.body.style.overflow = '';
    } else {
      document.getElementById('pw-err').textContent = '비밀번호가 틀렸습니다';
      document.getElementById('pw-input').value = '';
      document.getElementById('pw-input').focus();
    }
  };
  setTimeout(function() { document.getElementById('pw-input').focus(); }, 100);
})();
</script>

function fmtAmt(v) {
  if (v == null) return '-';
  const e = Math.floor(v / 1e8);
  const m = Math.round((v % 1e8) / 1e4);
  if (e > 0 && m > 0) return e.toLocaleString() + '억 ' + m.toLocaleString() + '만원';
  if (e > 0) return e.toLocaleString() + '억원';
  return Math.round(v / 1e4).toLocaleString() + '만원';
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function val(v) { return (v == null || v === '') ? '-' : esc(String(v)); }

function discRate(it) {
  if (!it.appraisal || !it.min_bid || it.appraisal <= 0) return null;
  return (1 - it.min_bid / it.appraisal) * 100;
}
function discColor(r) {
  if (r == null) return '#aaa';
  if (r >= 50)  return '#e74c3c';
  if (r >= 30)  return '#e67e22';
  if (r >= 10)  return '#f0b429';
  return '#aaa';
}

  document.getElementById('s-active').textContent    = items.filter(i=>i.color==='blue').length;

  document.getElementById('s-upcoming90').textContent = items.filter(i=>i.color==='amber').length;

  document.getElementById('list-cnt').textContent    = items.length;
}

function buildCbs(elId, values, cls) {
  const el = document.getElementById(elId);
  el.innerHTML = '';
  values.forEach(v => {
    const lbl = document.createElement('label');
    lbl.className = 'cb-item';
    lbl.innerHTML = '<input type="checkbox" class="' + cls + '" value="' + esc(v) + '" checked> ' + esc(v);
    el.appendChild(lbl);
  });
}

function filterByStat(key) {
  if (activeStat === key) {
    activeStat = null;
    document.querySelectorAll('.stat').forEach(el => el.classList.remove('stat-active'));
    filtered = ITEMS.slice(); filteredPvct = PVCT.slice();
    renderAll(); return;
  }
  activeStat = key;
  document.querySelectorAll('.stat').forEach(el => el.classList.remove('stat-active'));
  const btn = document.getElementById('stat-btn-' + key);
  if (btn) btn.classList.add('stat-active');

  if (key === 'total') {
    filtered = ITEMS.slice(); filteredPvct = PVCT.slice();
  } else if (key === 'pvct') {
    filtered = []; filteredPvct = PVCT.slice();
  } else if (key === 'pvct-new') {
    filtered = []; filteredPvct = PVCT.filter(isPvctNew);
  } else if (STAT_COLOR_MAP[key] === '__new7__') {
    filtered = ITEMS.filter(i => i.new7); filteredPvct = [];
  } else {
    const col = STAT_COLOR_MAP[key];
    filtered = ITEMS.filter(i => i.color === col); filteredPvct = [];
  }
  renderAll();
  if ((key === 'pvct-new' || key === 'pvct') && map && filteredPvct.length) {
    const bounds = new kakao.maps.LatLngBounds();
    let hasBounds = false;
    filteredPvct.forEach(function(it) {

    });
    if (hasBounds) map.setBounds(bounds);
  }
}

  const colors   = [...document.querySelectorAll('.cb-color:checked')].map(e=>e.value);
  const types    = [...document.querySelectorAll('.cb-type:checked')].map(e=>e.value);
  const stats    = [...document.querySelectorAll('.cb-status:checked')].map(e=>e.value);
  const use2s    = [...document.querySelectorAll('.cb-use2:checked')].map(e=>e.value);
  const minA     = (parseFloat(document.getElementById('f-min').value)||0) * 1e8;
  const maxA     = (parseFloat(document.getElementById('f-max').value)||0) * 1e8;
  const minDisc  = parseFloat(document.getElementById('f-disc').value) || 0;
  filtered = ITEMS.filter(i => {
    if (colors.length && !colors.includes(i.color))    return false;
    if (types.length  && !types.includes(i.prpt_type)) return false;
    if (stats.length  && !stats.includes(i.status))    return false;
    if (use2s.length  && !use2s.includes(i.use_lv2))   return false;
    if (minA > 0 && (i.appraisal||0) < minA) return false;
    if (maxA > 0 && (i.appraisal||0) > maxA) return false;
    if (minDisc > 0) { const dr = discRate(i); if (dr == null || dr < minDisc) return false; }
    return true;
  });
  filteredPvct = PVCT.filter(i => {
    if (use2s.length && !use2s.includes(i.use_lv2)) return false;
    if (minDisc > 0) { const dr = discRate(i); if (dr == null || dr < minDisc) return false; }
    return true;
  });
  renderAll();
}

function resetFilter() {
  activeStat = null;
  document.querySelectorAll('.stat').forEach(el => el.classList.remove('stat-active'));
  document.getElementById('f-min').value = '';
  document.getElementById('f-max').value = '';
  document.getElementById('f-disc').value = 0;
  document.getElementById('f-disc-val').textContent = '0';
  document.getElementById('f-sort').value = 'date';
  document.querySelectorAll('.cb-type,.cb-status,.cb-use2').forEach(cb=>cb.checked=true);
  filtered = ITEMS.slice();
  filteredPvct = PVCT.slice();
  renderAll();
}

/* ── 목록 렌더링 ──────────────────────────────── */
function renderList(items) {
  const sortEl = document.getElementById('f-sort');
  const sortBy = sortEl ? sortEl.value : 'date';
  const sorted = [...items].sort((a, b) => {
    if (sortBy === 'disc') {
      const da = discRate(a), db = discRate(b);
      if (da == null && db == null) return 0;
      if (da == null) return 1;
      if (db == null) return -1;
      return db - da;
    }
    if (sortBy === 'appraisal') return (b.appraisal || 0) - (a.appraisal || 0);
    if (!a.bid_start && !b.bid_start) return 0;
    if (!a.bid_start) return 1;
    if (!b.bid_start) return -1;
    return a.bid_start.localeCompare(b.bid_start);
  });
  document.getElementById('item-list').innerHTML = sorted.map(it => {
    const col = COLORS[it.color] || '#555';
    const dateStr = it.bid_start
      ? it.bid_start.slice(0,10) + ' ~ ' + (it.bid_end ? it.bid_end.slice(0,10) : '-')
      : '';
    const price = it.min_bid ? fmtAmt(it.min_bid) : (it.min_bid_str || '-');
    const dr = discRate(it);
    const dc = discColor(dr);
    const badge = dr != null
      ? '<span class="disc-badge" style="background:' + dc + ';color:#fff">-' + dr.toFixed(0) + '%</span>'
      : '';
    const progPct = (it.appraisal && it.min_bid)
      ? Math.max(0, Math.min(100, it.min_bid / it.appraisal * 100)).toFixed(1) : '0';
    const prog = (it.appraisal && it.min_bid)
      ? '<div class="c-prog-bg"><div class="c-prog-fg" style="width:' + progPct + '%;background:' + dc + '"></div></div>'
      : '';
    return '<div class="card' + (it.id===selId?' sel':'') + '" id="card-' + it.id + '" onclick="selectItem(' + it.id + ')">'
      + '<div class="c-bar" style="background:' + col + '"></div>'
      + '<div class="c-body">'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:4px;">'
      + '<div class="c-name" style="flex:1;min-width:0;">' + esc(it.name) + '</div>'
      + badge
      + '</div>'
      + '<div class="c-meta">' + esc(it.sido) + ' ' + esc(it.sigungu) + ' &middot; ' + esc(it.prpt_type) + ' &middot; ' + esc(it.status) + '</div>'
      + '<div class="c-price">감정가 ' + fmtAmt(it.appraisal) + ' / 최저 ' + price + '</div>'
      + prog
      + '<div class="c-meta">' + esc(dateStr) + '</div>'
      + '</div></div>';
  }).join('');
}

/* ── 마커 ─────────────────────────────────────── */
function mkImg(color) {
  const mobile = window.innerWidth <= 768;
  const w = mobile ? 28 : 22, h = mobile ? 38 : 30;
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 22 30">'
    + '<path d="M11 0C4.9 0 0 4.9 0 11c0 7.7 11 19 11 19s11-11.3 11-19C22 4.9 17.1 0 11 0z" fill="' + color + '"/>'
    + '<circle cx="11" cy="11" r="4.5" fill="white" fill-opacity="0.9"/>'
    + '</svg>';
  return new kakao.maps.MarkerImage(
    'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
    new kakao.maps.Size(w, h),
    {offset: new kakao.maps.Point(w/2, h)}
  );
}

function clearMarkers() {
  markers.forEach(m=>m.setMap(null));
  tips.forEach(t=>t.setMap(null));
  markers=[]; tips=[];
}

function mkDiamondImg(isNew) {
  const mobile = window.innerWidth <= 768;
  const w = mobile ? 28 : 22, h = mobile ? 28 : 22;
  const fill   = isNew ? '#e67e22' : '#27ae60';
  const stroke = isNew ? '#c0510a' : '#1a7a46';
  const inner  = isNew ? '#f39c12' : '#2ecc71';
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 24 24">'
    + '<polygon points="12,1 23,12 12,23 1,12" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.5"/>'
    + '<polygon points="12,5 19,12 12,19 5,12" fill="' + inner + '" opacity="0.6"/>'
    + (isNew ? '<circle cx="12" cy="12" r="3" fill="#fff" opacity="0.7"/>' : '')
    + '</svg>';
  return new kakao.maps.MarkerImage(
    'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
    new kakao.maps.Size(w, h),
    {offset: new kakao.maps.Point(w/2, h/2)}
  );
}

function clearPvctMarkers() {
  pvctMarkers.forEach(m=>m.setMap(null));
  pvctTips.forEach(t=>t.setMap(null));
  pvctMarkers=[]; pvctTips=[];
}

function isPvctNew(it) {
  return !!it.pvct_new;
}

function renderPvctMarkers() {
  clearPvctMarkers();
  if (!showPvct || !map) return;
  const imgNormal = mkDiamondImg(false);
  const imgNew    = mkDiamondImg(true);
  filteredPvct.forEach(it => {
    if (!it.lat || !it.lng) return;
    const isNew = isPvctNew(it);
    const pos = new kakao.maps.LatLng(it.lat, it.lng);
    const mk = new kakao.maps.Marker({ position: pos, image: isNew ? imgNew : imgNormal, map: map });
    const unsold = it.unsold_cnt != null ? ' (유찰 ' + it.unsold_cnt + '회)' : '';
    const newBadge = isNew ? '🆕 ' : '';
    const bgColor  = isNew ? 'rgba(180,70,10,.92)' : 'rgba(27,122,70,.92)';
    const tip = new kakao.maps.CustomOverlay({
      position: pos,
      content: '<div style="background:' + bgColor + ';color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;white-space:nowrap;pointer-events:none;font-family:Malgun Gothic,sans-serif;">' + newBadge + '◆ ' + esc(it.name) + unsold + '</div>',
      yAnchor: 2.0,
    });
    kakao.maps.event.addListener(mk, 'mouseover', function(){ tip.setMap(map); });
    kakao.maps.event.addListener(mk, 'mouseout',  function(){ tip.setMap(null); });
    kakao.maps.event.addListener(mk, 'click',     function(){ showPvctDetail(it); });
    pvctMarkers.push(mk);
    pvctTips.push(tip);
  });
}

function togglePvct(on) {
  showPvct = on;
  if (on) renderPvctMarkers(); else clearPvctMarkers();
}

function showPvctDetail(it) {
  const addr = [it.sido, it.sigungu, it.emd].filter(Boolean).join(' ');
  const url  = it.onbid_no
    ? 'https://www.onbid.co.kr/op/cta/cltragent/collateralLots/collateralLotsDetail.do?cltrNo=' + encodeURIComponent(it.onbid_no)
    : 'https://www.onbid.co.kr';

    ['재산유형',  it.prpt_type],
    ['용도',      it.use_lv1 + (it.use_lv2 ? ' > ' + it.use_lv2 : '')],

    ['입찰기간',  (it.bid_start||'').slice(0,10) + ' ~ ' + (it.bid_end||'').slice(0,10)],

    ['수의계약가', fmtAmt(it.min_bid) + (dr!=null ? ' (감정가 대비 -' + dr.toFixed(1) + '%)' : '')],
    ['유찰횟수',  it.unsold_cnt != null ? it.unsold_cnt + '회' : '-'],
    ['토지면적',  it.land_sqm != null ? it.land_sqm + '㎡' : '-'],
    ['건물면적',  it.bld_sqm  != null ? it.bld_sqm  + '㎡' : '-'],
    ['처분방식',  it.disposal],
    ['지분물건',  it.alc === 'Y' ? '⚠ 지분물건' : '아니오'],
    ['공고기관',  it.org],
    ['물건관리번호', it.cltr_no],
  ];
  if (!isMobile()) {
    document.getElementById('detail-ph').style.display = 'none';
    document.getElementById('detail-hdr').style.display = 'flex';
    const el = document.getElementById('detail-body');
    el.style.display = 'block';
    el.innerHTML = '<div class="d-title" style="color:#1a7a46;">◆ 수의계약 가능<br>' + esc(it.name) + '</div>'
      + rows.filter(r=>r[1]&&r[1]!=='-'&&r[1]!=='undefined').map(r=>'<div class="d-row"><span class="d-lbl">'+esc(r[0])+'</span><span class="d-val">'+val(r[1])+'</span></div>').join('')
      + '<a href="' + url + '" target="_blank" rel="noopener" class="btn-ob" style="background:#27ae60;">온비드에서 보기 &rarr;</a>';
    if (map && it.lat && it.lng) map.panTo(new kakao.maps.LatLng(it.lat, it.lng));
  } else {
    openPvctSheet(it, rows, url);
  }
}

function renderMarkers(items) {
  clearMarkers();
  items.forEach(it => {
    if (!it.lat || !it.lng) return;
    const pos = new kakao.maps.LatLng(it.lat, it.lng);
    const mk = new kakao.maps.Marker({
      position: pos,
      image: mkImg(COLORS[it.color]||'#555'),
      map: map,
    });
    const tip = new kakao.maps.CustomOverlay({
      position: pos,
      content: '<div style="background:rgba(0,0,0,.8);color:#fff;padding:3px 8px;border-radius:4px;font-size:11px;white-space:nowrap;pointer-events:none;font-family:Malgun Gothic,sans-serif;">' + esc(it.name) + '</div>',
      yAnchor: 2.1,
    });
    kakao.maps.event.addListener(mk, 'mouseover', function(){ tip.setMap(map); });
    kakao.maps.event.addListener(mk, 'mouseout',  function(){ tip.setMap(null); });
    kakao.maps.event.addListener(mk, 'click',     function(){ selectItem(it.id); });
    markers.push(mk);
    tips.push(tip);
  });
}

/* ── 선택 ─────────────────────────────────────── */
function selectItem(id) {
  selId = id;
  const it = ITEMS.find(i=>i.id===id);
  if (!it) return;
  document.querySelectorAll('.card').forEach(el=>el.classList.remove('sel'));
  const card = document.getElementById('card-'+id);
  if (card) { card.classList.add('sel'); card.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  if (map && it.lat && it.lng) map.panTo(new kakao.maps.LatLng(it.lat, it.lng));
  if (isMobile()) { switchTab('map'); openSheet(it); } else { showDetail(it); }
}

/* ── 로드뷰 ───────────────────────────────────── */
var rvOn = false, rvClient = null, rvObj = null, rvMarker = null, rvListener = null;

function toggleRV() {
  rvOn = !rvOn;
  var btn   = document.getElementById('rv-btn');
  var panel = document.getElementById('rv-panel');
  var badge = document.getElementById('rv-hint-badge');
  var mapEl = document.getElementById('map');

  if (rvOn) {
    btn.classList.add('active');
    panel.style.display = 'flex';
    badge.style.display = 'block';
    mapEl.style.cursor = 'crosshair';

    if (!rvClient) {
      rvClient = new kakao.maps.RoadviewClient();
      rvObj    = new kakao.maps.Roadview(document.getElementById('roadview'));
    }
    rvListener = kakao.maps.event.addListener(map, 'click', function(e) {
      showRV(e.latLng);
    });
  } else {
    btn.classList.remove('active');
    panel.style.display = 'none';
    badge.style.display = 'none';
    mapEl.style.cursor = '';
    if (rvListener) { kakao.maps.event.removeListener(rvListener); rvListener = null; }
    if (rvMarker)   { rvMarker.setMap(null); rvMarker = null; }
  }
}

function showRV(latlng) {
  document.getElementById('rv-hint-badge').style.display = 'none';
  rvClient.getNearestPanoId(latlng, 50, function(panoId) {
    var label = document.getElementById('rv-label');
    if (panoId === null) {
      label.textContent = '⚠ 해당 위치에 로드뷰가 없습니다 (반경 50m)';
    } else {
      rvObj.setPanoId(panoId, latlng);
      label.textContent = '📷 로드뷰';
      if (!rvMarker) {
        rvMarker = new kakao.maps.Marker({ map: map, position: latlng });
      } else {
        rvMarker.setPosition(latlng);
      }
    }
  });
}

/* ── 주소 검색 ────────────────────────────────── */
var _searchMarker = null;
var _searchIw = null;

function searchAddr() {
  var q = document.getElementById('map-search-input').value.trim();
  var msg = document.getElementById('map-search-msg');
  msg.style.display = 'none';
  if (!q || !map) return;

  function showMsg(txt) {
    msg.textContent = txt;
    msg.style.display = 'block';
    setTimeout(function(){ msg.style.display = 'none'; }, 3000);
  }

  function placeSearchMarker(lat, lng, label) {
    if (_searchMarker) _searchMarker.setMap(null);
    if (_searchIw) _searchIw.close();
    var pos = new kakao.maps.LatLng(lat, lng);
    _searchMarker = new kakao.maps.Marker({ position: pos, map: map });
    _searchIw = new kakao.maps.InfoWindow({
      content: '<div style="padding:5px 10px;font-size:12px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;">' + label + '</div>',
      removable: true
    });
    _searchIw.open(map, _searchMarker);
    map.setCenter(pos);
    map.setLevel(4);
    kakao.maps.event.addListener(_searchMarker, 'click', function() {
      _searchIw.open(map, _searchMarker);
    });
  }

  // 1차: 주소 검색
  var gc = new kakao.maps.services.Geocoder();
  gc.addressSearch(q, function(result, status) {
    if (status === kakao.maps.services.Status.OK) {
      placeSearchMarker(result[0].y, result[0].x, result[0].address_name || q);
    } else {
      // 2차: 키워드(장소명) 검색
      var ps = new kakao.maps.services.Places();
      ps.keywordSearch(q, function(data, status2) {
        if (status2 === kakao.maps.services.Status.OK) {
          placeSearchMarker(data[0].y, data[0].x, data[0].place_name || q);
        } else {
          showMsg('검색 결과가 없습니다: ' + q);
        }
      });
    }
  });
}

/* ── 모바일 유틸 / 탭 ─────────────────────────── */
function isMobile() { return window.innerWidth <= 768; }

function switchTab(tab) {
  document.body.setAttribute('data-tab', tab);
  document.querySelectorAll('.m-tab').forEach(function(el) {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  if (tab !== 'map') closeSheet();
  if (tab === 'map' && map) setTimeout(function(){ kakao.maps.event.trigger(map,'resize'); }, 50);
  if (tab === 'filter') updateApplyCount();
}

/* ── 빠른 필터 칩 ─────────────────────────────── */
var CHIP_DEFS = [
  {key:'all',label:'전체'},{key:'orange',label:'오늘신규'},{key:'purple',label:'신규7일'},
  {key:'blue',label:'진행중'},{key:'red',label:'30일내'},{key:'coral',label:'60일내'},{key:'amber',label:'90일내'},
];
var activeChip = 'all';

function buildChips() {
  var el = document.getElementById('m-chips');
  if (!el) return;
  el.innerHTML = '';
  CHIP_DEFS.forEach(function(c) {
    var btn = document.createElement('button');
    btn.className = 'm-chip' + (c.key === activeChip ? ' active' : '');
    btn.textContent = c.label;
    btn.setAttribute('data-chip', c.key);
    el.appendChild(btn);
  });
  el.onclick = function(e) {
    var b = e.target.closest('.m-chip');
    if (b) selectChip(b.getAttribute('data-chip'));
  };
}

function selectChip(key) {
  activeChip = key;
  buildChips();
  activeStat = null;
  const chipToStat = {all:'total',orange:'new-today',purple:'new',blue:'active',red:'upcoming',coral:'upcoming60',amber:'upcoming90'};
  filterByStat(chipToStat[key] || 'total');
}

/* ── 필터 적용 카운트 ─────────────────────────── */
function updateApplyCount() {
  var btn = document.getElementById('m-apply-btn');
  if (btn) btn.textContent = '적용 ('+filtered.length+'건)';
}
function mobileApply() { applyFilter(); switchTab('list'); }
function mobileReset() { activeChip='all'; resetFilter(); buildChips(); }

/* ── 목록 서브탭 ──────────────────────────────── */
var activeListType = 'items';

function switchListType(type) {
  activeListType = type;
  document.querySelectorAll('.m-list-tab').forEach(function(b) {
    b.classList.toggle('active', b.dataset.listtype === type);
  });
  var hdr = document.getElementById('list-hdr');
  if (hdr) hdr.style.display = (type === 'items') ? '' : 'none';
  var listEl = document.getElementById('item-list');
  if (listEl) listEl.onclick = null;
  if (type === 'pvct') renderPvctList();
  else renderList(filtered);
}

function renderPvctList() {
  var el = document.getElementById('item-list');
  if (!el) return;
  if (!filteredPvct || filteredPvct.length === 0) {
    el.innerHTML = '<div style="padding:32px;text-align:center;color:#aaa;font-size:14px;">수의계약 가능 물건이 없습니다</div>';
    el.onclick = null;
    return;
  }
  el.innerHTML = filteredPvct.map(function(it) {
    var addr = [it.sido, it.sigungu, it.emd].filter(Boolean).join(' ');
    var dr = (it.appraisal && it.min_bid) ? (1 - it.min_bid / it.appraisal) * 100 : null;
    var badge = dr != null ? '<span class="disc-badge" style="color:#c00;border:1px solid #fbb;background:#fff5f5;">-' + dr.toFixed(1) + '%</span>' : '';
    var isNew = isPvctNew(it);
    var barColor = isNew ? '#e67e22' : '#27ae60';
    var newTag = isNew ? '<span style="font-size:10px;background:#e67e22;color:#fff;border-radius:3px;padding:1px 5px;margin-right:4px;flex-shrink:0;">신규</span>' : '';
    return '<div class="pvct-card" data-pvctid="' + it.id + '">'
      + '<div class="c-bar" style="background:' + barColor + ';"></div>'
      + '<div class="c-body" style="flex:1;min-width:0;">'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:4px;">'
      + '<div class="c-name" style="flex:1;min-width:0;">' + newTag + '&#9670; ' + esc(it.name) + '</div>'
      + badge + '</div>'
      + '<div class="c-meta">' + esc(addr) + (it.prpt_type ? ' &middot; ' + esc(it.prpt_type) : '') + '</div>'
      + '<div class="c-price">감정가 ' + fmtAmt(it.appraisal) + ' / 수의계약가 ' + fmtAmt(it.min_bid) + '</div>'
      + '</div></div>';
  }).join('');
  el.onclick = function(e) {
    var card = e.target.closest('[data-pvctid]');
    if (card) selectPvctItem(card.dataset.pvctid);
  };
}

function selectPvctItem(id) {
  var it = filteredPvct.find(function(i){ return i.id === id; });
  if (!it) return;
  if (map && it.lat && it.lng) map.panTo(new kakao.maps.LatLng(it.lat, it.lng));
  showPvctDetail(it);
  switchTab('map');
}

/* ── 슬라이드업 시트 ──────────────────────────── */
function openPvctSheet(it, rows, url) {
  var sheet = document.getElementById('m-sheet');
  if (!sheet) return;
  document.getElementById('m-sheet-scroll').innerHTML =
    '<div class="d-title" style="color:#1a7a46;margin-bottom:10px;">◆ 수의계약 가능<br>' + esc(it.name) + '</div>'
    + rows.filter(function(r){return r[1]&&r[1]!=='-'&&r[1]!=='undefined';})
         .map(function(r){return '<div class="d-row"><span class="d-lbl">'+esc(r[0])+'</span><span class="d-val">'+val(r[1])+'</span></div>';}).join('')
    + '<a href="'+url+'" target="_blank" rel="noopener" class="btn-ob" style="background:#27ae60;">온비드에서 보기 →</a>';
  sheet.style.height = '55vh';
  sheet.classList.add('open');
  if (map && it.lat && it.lng) map.panTo(new kakao.maps.LatLng(it.lat, it.lng));
  switchTab('map');
}

function openSheet(it) {
  var sheet = document.getElementById('m-sheet');
  if (!sheet) return;
  document.getElementById('m-sheet-scroll').innerHTML = buildSheetContent(it);
  sheet.style.height = '50vh';
  sheet.classList.add('open');
}
function closeSheet() {
  var s = document.getElementById('m-sheet');
  if (s) s.classList.remove('open');
}
function buildSheetContent(it) {
  var url = it.onbid_no
    ? 'https://www.onbid.co.kr/op/cta/cltragent/collateralLots/collateralLotsDetail.do?cltrNo='+encodeURIComponent(it.onbid_no)
    : 'https://www.onbid.co.kr';
  var price = it.min_bid ? fmtAmt(it.min_bid) : (it.min_bid_str||'-');
  var addr = [it.sido,it.sigungu,it.emd].filter(Boolean).join(' ');
  var use  = [it.use_lv1,it.use_lv2,it.use_lv3].filter(Boolean).join(' > ');
  var dr = discRate(it);
  var dc = discColor(dr);
  var minPct = (it.appraisal&&it.min_bid) ? Math.max(0,Math.min(100,it.min_bid/it.appraisal*100)).toFixed(1) : '0';
  var discLabel = dr!=null ? ' (-'+dr.toFixed(1)+'%)' : '';
  var priceBar = (it.appraisal&&it.min_bid)
    ? '<div class="dpb-wrap">'
      +'<div class="dpb-row"><span class="dpb-lbl">감정가</span>'
      +'<div class="dpb-bar-bg"><div class="dpb-bar-fg" style="width:100%;background:#1a73e8"></div></div>'
      +'<span class="dpb-val">'+fmtAmt(it.appraisal)+'</span></div>'
      +'<div class="dpb-row"><span class="dpb-lbl">최저가</span>'
      +'<div class="dpb-bar-bg"><div class="dpb-bar-fg" style="width:'+minPct+'%;background:'+dc+'"></div></div>'
      +'<span class="dpb-val" style="color:'+dc+';font-weight:bold;">'+fmtAmt(it.min_bid)+discLabel+'</span></div>'
      +'</div>' : '';
  var rows = [['소재지',addr],
    ['유찰횟수',it.unsold_cnt!=null?it.unsold_cnt+'회':null],
    ['입찰기간',(it.bid_start||'-')+' ~ '+(it.bid_end||'-')],
    ['입찰상태',it.status],['용도',use]].filter(function(r){return r[1];});
  return '<div style="font-size:15px;font-weight:bold;color:#1a1a2e;margin-bottom:8px;line-height:1.4;">'+esc(it.name)+'</div>'
    + priceBar
    +rows.map(function(r){return '<div class="d-row"><span class="d-lbl">'+esc(r[0])+'</span><span class="d-val">'+val(r[1])+'</span></div>';}).join('')
    +'<a href="'+url+'" target="_blank" rel="noopener" class="btn-ob" style="margin-top:14px;padding:16px;font-size:15px;">온비드에서 보기 &rarr;</a>';
}

/* ── 시트 드래그 ──────────────────────────────── */
(function(){
  var startY=0,startH=0,drag=false;
  document.addEventListener('DOMContentLoaded',function(){
    var handle=document.getElementById('m-sheet-handle'), sheet=document.getElementById('m-sheet');
    if(!handle||!sheet) return;
    handle.addEventListener('touchstart',function(e){startY=e.touches[0].clientY;startH=sheet.offsetHeight;drag=true;sheet.style.transition='none';e.preventDefault();},{passive:false});
    document.addEventListener('touchmove',function(e){if(!drag)return;var newH=startH-(e.touches[0].clientY-startY);sheet.style.height=Math.max(60,Math.min(window.innerHeight*.93,newH))+'px';e.preventDefault();},{passive:false});
    document.addEventListener('touchend',function(e){
      if(!drag)return;drag=false;sheet.style.transition='height .25s ease';
      var h=sheet.offsetHeight,wh=window.innerHeight;
      var vel=startY-(e.changedTouches[0].clientY); // positive = swipe up
      if(h<120||vel<-60)closeSheet();
      else if(h>wh*.68||vel>60)sheet.style.height='90vh';
      else sheet.style.height='55vh';
    });
  });
})();
